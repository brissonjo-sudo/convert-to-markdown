name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: Tests navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --omit=optional : pdfjs-dist propose un module natif (canvas) inutile ici
      - name: Installer les dépendances de test
        run: npm ci --omit=optional

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npx playwright test

      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright
          path: test-results/
          retention-days: 7
