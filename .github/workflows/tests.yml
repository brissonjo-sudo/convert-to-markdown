name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: Tests navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --omit=optional : pdfjs-dist propose un module natif (canvas) inutile ici
      - name: Installer les dépendances de test
        run: npm ci --omit=optional

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests
        run: npx playwright test

      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-playwright
          path: test-results/
          retention-days: 7

  empreintes:
    name: Empreintes des bibliothèques (CDN réel)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Une bibliothèque modifiée sur le CDN, ou une empreinte erronée, bloquerait
      # l'outil chez les utilisateurs : on compare aux fichiers réellement servis
      - name: Comparer les empreintes SRI aux fichiers des CDN
        run: node tests/verifier-cdn.js
